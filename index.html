<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MST Visualizer - Prim & Kruskal</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f4f4f0;color:#222;display:flex;flex-direction:column;min-height:100vh}
  .bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:#e4e4de}
  button,select{border:1px solid #888;background:#fff;color:#222;padding:6px 10px;border-radius:5px;font-size:13px;cursor:pointer}
  button:hover{background:#f0f0f0}
  button.modebtn.active{background:#9fd0f5 !important;border-color:#4a90c8 !important}
  button.algobtn.active{background:#90ee90 !important;border-color:#3a9a3a !important}
  .sep{width:10px}
  label{font-size:13px}
  #prim-wrap{display:none;align-items:center;gap:4px}
  canvas{display:block;width:calc(100% - 20px);height:420px;margin:6px 10px;background:#fafaf7;border:1px solid #ccc;touch-action:none}
  #log{margin:0 10px 10px;padding:10px;background:#eee;font:13px/1.5 Consolas,Menlo,monospace;white-space:pre-wrap;min-height:200px;border-radius:4px}
</style>
</head>
<body>
<div class="bar">
  <button class="modebtn active" data-mode="vertex">Vertex</button>
  <button class="modebtn" data-mode="edge">Edge</button>
  <button class="modebtn" data-mode="move">Move</button>
  <button class="modebtn" data-mode="delete">Delete</button>
  <span class="sep"></span>
  <label>Naming: <select id="naming"><option value="number">number</option><option value="alphabet">alphabet</option></select></label>
  <span class="sep"></span>
  <button class="algobtn" id="bPrim">Prim</button>
  <button class="algobtn" id="bKruskal">Kruskal</button>
  <span id="prim-wrap"><label>Start: <select id="primStart"></select></label></span>
  <span class="sep"></span>
  <button id="bStep">Step</button>
  <button id="bPlay">Play</button>
  <button id="bReset">Reset</button>
  <button id="bRandom">Random</button>
  <button id="bClear">Clear</button>
  <label>Speed: <input id="speed" type="range" min="1" max="10" value="4"></label>
</div>
<canvas id="cv"></canvas>
<div id="log"></div>

<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d'), R=18;
let V={}, E={}, nextId=0, sel=null, mode='vertex';
let steps=[], idx=0, stats=null, algo='', playing=false, drag=null, timer=null;

const $=id=>document.getElementById(id);
const ek=(u,v)=>[u,v].sort(cmpId).join('|');
const isNum=s=>/^-?\d+$/.test(s);
function cmpId(a,b){return isNum(a)&&isNum(b)?a-b:(a<b?-1:a>b?1:0);}
const strSort=(a,b)=>String(a)<String(b)?-1:String(a)>String(b)?1:0;
function toAlpha(i){let r='';while(true){const q=Math.floor(i/26),m=i%26;r=String.fromCharCode(65+m)+r;i=q;if(i===0)break;i-=1;}return r;}
function nextVertexId(){const i=nextId++;return $('naming').value==='number'?String(i):toAlpha(i);}

function resize(){
  const r=cv.getBoundingClientRect();
  cv.width=r.width*devicePixelRatio; cv.height=r.height*devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); draw();
}
addEventListener('resize',resize);
const size=()=>{const r=cv.getBoundingClientRect();return{w:r.width,h:r.height};};

class DSU{constructor(a){this.p={};a.forEach(x=>this.p[x]=x);}
  find(x){while(this.p[x]!==x){this.p[x]=this.p[this.p[x]];x=this.p[x];}return x;}
  union(a,b){this.p[this.find(a)]=this.find(b);}}

const edgeCmp=(a,b)=>a.w-b.w||cmpId(a.u,b.u)||cmpId(a.v,b.v);
function edgeList(){return Object.entries(E).map(([k,w])=>{const [u,v]=k.split('|');return{w,u,v};});}

function kruskal(Vs,El){
  const t0=performance.now(), dsu=new DSU(Vs), st=[]; let cmp=0;
  const se=[...El].sort(edgeCmp);
  st.push({kind:'init',msg:`Step 1: All graph edges sorted in ascending order by weight:\n[${se.map(e=>`${e.u}-${e.v} (w=${e.w})`).join(', ')}]\n• Kruskal's algorithm will now process these starting from the smallest weight.`});
  let n=2;
  for(const {w,u,v} of se){
    cmp++; const ru=dsu.find(u), rv=dsu.find(v);
    if(ru!==rv){dsu.union(u,v);
      st.push({kind:'accept',edge:[u,v,w],msg:`Step ${n}: Examining minimum edge ${u}-${v} (weight = ${w}):\n• Cycle Check: DSU roots Find(${u}) = ${ru} and Find(${v}) = ${rv} are different.\n• Result: Does NOT form a cycle. ACCEPTED — added to MST connections and included in running total cost.`});}
    else st.push({kind:'reject',edge:[u,v,w],msg:`Step ${n}: Examining minimum edge ${u}-${v} (weight = ${w}):\n• Cycle Check: DSU roots Find(${u}) = ${ru} and Find(${v}) = ${rv} are the same.\n• Result: Forms a cycle. REJECTED — skipped.`});
    n++;
  }
  return [st,{time:(performance.now()-t0)*1000,ops:cmp,complexity:'O(E log E)'}];
}

function prim(Vs,El,startNode){
  const t0=performance.now(), adj={}; Vs.forEach(v=>adj[v]=[]);
  for(const {w,u,v} of El){adj[u].push({w,u,v});adj[v].push({w,u:v,v:u});}
  const seen=new Set(), st=[]; let pops=0, n=1;
  const nodes=[...Vs].sort(strSort);
  if(startNode!=null&&nodes.includes(startNode)){nodes.splice(nodes.indexOf(startNode),1);nodes.unshift(startNode);}
  for(const s of nodes){
    if(seen.has(s))continue; seen.add(s);
    st.push({kind:'start',node:s,msg:`Step ${n}: Initialize tree component at root vertex ${s}.\n• Mark ${s} as visited and load all incident edges into the min-priority queue.`}); n++;
    const h=[...adj[s]];
    while(h.length){
      h.sort(edgeCmp); const {w,u,v}=h.shift(); pops++;
      if(seen.has(v)){st.push({kind:'reject',edge:[u,v,w],msg:`Step ${n}: Min-heap pop edge ${u}-${v} (weight = ${w}):\n• Vertex ${v} is already visited.\n• Result: REJECTED — creates a cycle.`});n++;continue;}
      seen.add(v);
      st.push({kind:'accept',edge:[u,v,w],node:v,msg:`Step ${n}: Min-heap pop edge ${u}-${v} (weight = ${w}):\n• Vertex ${v} is unvisited.\n• Result: ACCEPTED — adds ${v} to MST connections and running cost.`});n++;
      for(const e of adj[v]) if(!seen.has(e.v)) h.push(e);
    }
  }
  return [st,{time:(performance.now()-t0)*1000,ops:pops,complexity:'O(E log V)'}];
}

// ---------- editing ----------
function vertexAt(x,y){for(const i in V){if(Math.hypot(x-V[i][0],y-V[i][1])<=R)return i;}return null;}
function edgeAt(x,y){
  for(const k in E){const [u,v]=k.split('|');const [x1,y1]=V[u],[x2,y2]=V[v];const dx=x2-x1,dy=y2-y1;
    const t=Math.max(0,Math.min(1,((x-x1)*dx+(y-y1)*dy)/((dx*dx+dy*dy)||1)));
    if(Math.hypot(x-(x1+t*dx),y-(y1+t*dy))<9)return k;}
  return null;
}
function invalidate(){playing=false;clearTimeout(timer);steps=[];idx=0;stats=null;algo='';
  document.querySelectorAll('.algobtn').forEach(b=>b.classList.remove('active'));$('prim-wrap').style.display='none';}
function updateStartMenu(){
  const m=$('primStart'), keys=Object.keys(V).sort(strSort), cur=m.value;
  m.innerHTML=keys.map(k=>`<option>${k}</option>`).join('');
  m.value=keys.includes(cur)?cur:(keys[0]||'');
}
const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];};

cv.addEventListener('pointerdown',e=>{
  const [x,y]=pos(e), v=vertexAt(x,y);
  if(mode==='vertex'&&v===null){V[nextVertexId()]=[x,y];updateStartMenu();invalidate();}
  else if(mode==='edge'&&v!==null){
    if(sel===null)sel=v;
    else if(v!==sel){
      const s=prompt(`Weight of ${sel}-${v} (can be negative):`,'5'), w=parseInt(s,10);
      if(s!==null&&!isNaN(w)&&Math.abs(w)<=999){E[ek(sel,v)]=w;invalidate();}
      sel=null;
    }
  }
  else if(mode==='move'&&v!==null)drag=v;
  else if(mode==='delete'){
    if(v!==null){delete V[v];for(const k in E){const [a,b]=k.split('|');if(a===v||b===v)delete E[k];}updateStartMenu();invalidate();}
    else{const k=edgeAt(x,y);if(k){delete E[k];invalidate();}}
  }
  draw();
});
cv.addEventListener('pointermove',e=>{if(drag!==null){V[drag]=pos(e);draw();}});
addEventListener('pointerup',()=>drag=null);

document.querySelectorAll('.modebtn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.modebtn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');mode=b.dataset.mode;sel=null;draw();});

$('naming').onchange=()=>{
  const val=$('naming').value, keys=Object.keys(V).sort(strSort), map={};
  keys.forEach((k,i)=>map[k]=val==='number'?String(i):toAlpha(i));
  const nV={},nE={};
  for(const k in V)nV[map[k]]=V[k];
  for(const k in E){const [a,b]=k.split('|');nE[ek(map[a],map[b])]=E[k];}
  V=nV;E=nE;if(sel!==null&&map[sel]!==undefined)sel=map[sel];
  nextId=keys.length;invalidate();updateStartMenu();draw();
};

function clearAll(){V={};E={};nextId=0;sel=null;updateStartMenu();invalidate();draw();}
function randomGraph(){
  clearAll(); const n=5+Math.floor(Math.random()*5), {w:W,h:H}=size(), keys=[];
  for(let i=0;i<n;i++){const id=nextVertexId();keys.push(id);
    const a=2*Math.PI*i/n+(Math.random()*0.12-0.06);
    V[id]=[W/2+Math.cos(a)*W*0.36*0.8,H/2+Math.sin(a)*H*0.36];}
  const rw=()=>Math.floor(Math.random()*26)-5;
  for(let i=0;i<n;i++)E[ek(keys[i],keys[(i+1)%n])]=rw();
  for(let i=0;i<n;i++){const off=2+Math.floor(Math.random()*Math.max(1,Math.min(n-1,3)-1));
    const k=ek(keys[i],keys[(i+off)%n]);if(keys[i]!==keys[(i+off)%n]&&!(k in E))E[k]=rw();}
  updateStartMenu();draw();
}

function start(name){
  if(Object.keys(V).length<2||!Object.keys(E).length){alert('Add at least 2 vertices and 1 edge.');return;}
  const Vs=Object.keys(V);
  [steps,stats]=name==='Prim'?prim(Vs,edgeList(),$('primStart').value):kruskal(Vs,edgeList());
  algo=name;idx=0;playing=false;clearTimeout(timer);draw();
}
function selectAlgo(name){
  document.querySelectorAll('.algobtn').forEach(b=>b.classList.remove('active'));
  $(name==='Prim'?'bPrim':'bKruskal').classList.add('active');
  $('prim-wrap').style.display=name==='Prim'?'inline-flex':'none';
  start(name);
}
function step(){if(steps.length&&idx<=steps.length){idx++;draw();}else playing=false;}
function tick(){
  if(playing&&idx<=steps.length){step();timer=setTimeout(tick,Math.floor(2400/$('speed').value));}
  else playing=false;
}
$('bPrim').onclick=()=>selectAlgo('Prim');
$('bKruskal').onclick=()=>selectAlgo('Kruskal');
$('primStart').onchange=()=>{if(algo==='Prim')start('Prim');};
$('bStep').onclick=step;
$('bPlay').onclick=()=>{if(!steps.length)return;if(idx>steps.length)idx=0;playing=!playing;if(playing)tick();};
$('bReset').onclick=()=>{playing=false;clearTimeout(timer);idx=0;draw();};
$('bRandom').onclick=randomGraph;
$('bClear').onclick=clearAll;

// ---------- drawing ----------
function draw(){
  const {w:W,h:H}=size(); ctx.clearRect(0,0,W,H);
  const acc=new Set(),rej=new Set(),tree=new Set(); let cur=null;
  const di=Math.min(idx,steps.length);
  for(let i=0;i<di;i++){const s=steps[i];
    if(s.kind==='start')tree.add(s.node);
    else if(s.kind!=='init'){const [u,v]=s.edge,k=ek(u,v);(s.kind==='accept'?acc:rej).add(k);
      if(s.kind==='accept'){tree.add(u);tree.add(v);} if(i===di-1&&idx<=steps.length)cur=k;}}
  for(const k in E){
    const [u,v]=k.split('|'),[x1,y1]=V[u],[x2,y2]=V[v];
    let col='#b8b8b0',wd=2,dash=[];
    if(acc.has(k)){col='#1b9e5a';wd=5;}else if(rej.has(k)){col='#d64545';dash=[6,4];}
    if(k===cur){col=rej.has(k)?'#d64545':'#f08c00';wd=6;}
    ctx.beginPath();ctx.setLineDash(dash);ctx.strokeStyle=col;ctx.lineWidth=wd;ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);
    const mx=(x1+x2)/2,my=(y1+y2)/2;
    ctx.fillStyle='#fff';ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.fillRect(mx-14,my-10,28,20);ctx.strokeRect(mx-14,my-10,28,20);
    ctx.fillStyle='#111';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(E[k],mx,my);
  }
  for(const i in V){const [x,y]=V[i];
    ctx.beginPath();ctx.arc(x,y,R,0,7);ctx.fillStyle=i===sel?'#f08c00':tree.has(i)?'#1b9e5a':'#2f3e55';ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(i,x,y);}
  updateLog(acc);
}

function updateLog(acc){
  let txt;
  if(!steps.length)txt='Build or edit a graph, then run Prim or Kruskal.\nGreen = in MST   Red dashed = rejected (cycle)   Orange = current';
  else{
    let tot=0;acc.forEach(k=>tot+=E[k]);
    const list=[...acc].map(k=>{const [a,b]=k.split('|');return `${a}-${b} (w=${E[k]})`;}).sort();
    const disp=list.length?list.join(', '):'None yet';
    if(idx>steps.length){
      txt=`Final MST Connections: [${disp}]\nTotal Weight / Cost: ${tot}\nExecution Time: ${stats.time.toFixed(1)} us\n${algo==='Prim'?'Heap Pops':'Edge Comparisons'}: ${stats.ops}\nTime Complexity: ${stats.complexity}`;
      const comps=Object.keys(V).length-acc.size;
      if(comps>1)txt+=`\nGraph Status: Disconnected (Spanning Forest with ${comps} components)`;
    }else{
      const msg=idx?steps[idx-1].msg:'Ready - press Step or Play';
      txt=`[${algo}] Step ${idx}/${steps.length}\n• Current MST Connections: [${disp}]\n• Running Total Weight: ${tot}\n${'-'.repeat(70)}\n${msg}`;
    }
  }
  $('log').textContent=txt;
}

resize();randomGraph();
</script>
</body>
</html>
